name: Cypress Test with action

on:
  workflow_dispatch:

env:
  DEBUG: '@cypress/github-action'
  NO_COLOR: true

jobs:
  Cypress-Test-options:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show default Node.js
        run: node -v

      - name: Setup Node.js 24 environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Show selected Node.js
        run: node --version; npm --version; which -a node; echo $PATH

      - run: npm ci

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install-command: node -v
          build: node -v
          start: node -v
          browser: chrome

  Cypress-Test-with-action:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24 environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
